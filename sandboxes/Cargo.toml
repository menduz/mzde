[package]
name = "sandboxes"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
description = "Named sandboxes for programs: the sandbox command"
publish = false

[[bin]]
name = "sandbox"
path = "src/main.rs"

[dependencies]
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
panic = "abort"
